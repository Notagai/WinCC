<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 928" role="img" aria-labelledby="title desc">
<title id="title">WinCC optional Winter Glass starter layout schematic</title>
<desc id="desc">Optional Winter Glass example preset with translucent clock, calendar, Spotify, system, weather, notes and AI island. WinCC is a freeform canvas: every widget may be moved and resized in Edit Mode, and layout is locked in Normal Mode.</desc>
