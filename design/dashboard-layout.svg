<linearGradient id="bg" x2=".7" y2="1"><stop stop-color="#8eb4d6"/><stop offset=".55" stop-color="#53789d"/><stop offset="1" stop-color="#243f5c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#172e4c" stop-opacity=".83"/><stop offset="1" stop-color="#233a55" stop-opacity=".75"/></linearGradient>
</defs>
